<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="script-src 'self' 'inline-script-hashes' 'unsafe-eval' file: blob:; worker-src 'self' blob:; child-src 'self' blob: board: html-preview:; object-src 'none'; base-uri 'self';" />
  <title>Persephone</title>
  <style id="startup-background">
    body {
      background-color: #1b2935;
    }
  </style>
  <script>
    // Apply saved theme background before first paint to avoid flash.
    // Runs synchronously in <head> before the renderer bundle loads.
    // Its hash is computed by inlineScriptHashesPlugin.
    try {
      const p = require("path");
      const f = require("fs");
      const sp = p.join(process.env.APPDATA, "persephone", "data", "appSettings.json");
      const raw = f.readFileSync(sp, "utf-8").replace(/^\s*\/\/.*$/gm, "");
      const t = JSON.parse(raw).theme;
      if (t) {
        // Theme definition files map --color-bg-default to the editor background.
        // We inline a minimal lookup to avoid importing the full theme module.
        const bgs = {
          "default-dark": "#1f1f1f", "persephone": "#1b2935", "solarized-dark": "#002b36", "monokai": "#272822",
          "light-modern": "#FFFFFF", "persephone-light": "#fbfcfd", "solarized-light": "#FDF6E3", "quiet-light": "#F5F5F5"
        };
        let background = bgs[t];
        if (!background && /^custom-[a-z0-9]+(?:-[a-z0-9]+)*$/.test(t)) {
          const themePath = p.join(process.env.APPDATA, "persephone", "data", "themes", t + ".theme.json");
          const theme = JSON.parse(f.readFileSync(themePath, "utf-8"));
          const isObject = value => value !== null && typeof value === "object" && !Array.isArray(value);
          const supportedColor = value => {
            if (typeof value !== "string") return false;
            if (/^#(?:[\da-f]{3,4}|[\da-f]{6}|[\da-f]{8})$/i.test(value)) return true;
            const rgb = /^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*(0|1|0?\.\d+))?\s*\)$/i.exec(value);
            if (!rgb || [rgb[1], rgb[2], rgb[3]].some(channel => Number(channel) > 255)) return false;
            const alpha = rgb[4] === undefined ? undefined : Number(rgb[4]);
            if (alpha !== undefined && (alpha < 0 || alpha > 1)) return false;
            return value.trim().toLowerCase().startsWith("rgba(") ? alpha !== undefined : alpha === undefined;
          };
          if (theme.schemaVersion === 1 && theme.id === t && typeof theme.name === "string" && theme.name.trim()
            && isObject(theme.base) && isObject(theme.overrides)
            && supportedColor(theme.base.background) && supportedColor(theme.base.text) && supportedColor(theme.base.accent)) {
            const overrideBackground = theme.overrides["--color-bg-default"];
            const candidate = supportedColor(overrideBackground) ? overrideBackground : theme.base.background;
            if (supportedColor(candidate)) background = candidate;
          }
        }
        if (background) document.getElementById("startup-background").textContent = "body{background-color:" + background + "}";
      }
    } catch (e) { /* use default */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/renderer.ts"></script>
</body>

</html>
