<!doctype html>
<html>
<head><meta charset="utf-8"><title>Observe network fixture</title></head>
<body>
    <button id="post-exact" onclick="fetch('/echo', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: 'observe-fake-request-body' }).then(response => response.text()).then(text => document.querySelector('#result').textContent = text)">POST exact</button>
    <button id="post-varying" onclick="fetch('/echo?n=' + Date.now(), { method: 'POST', headers: { 'content-type': 'text/plain' }, body: 'observe-fake-varying-request' }).then(response => response.text()).then(text => document.querySelector('#result').textContent = text)">POST varying</button>
    <button id="status-error" onclick="fetch('/status?code=503').then(response => response.text()).then(text => document.querySelector('#result').textContent = text)">Fetch 503</button>
    <output id="result"></output>
</body>
</html>
