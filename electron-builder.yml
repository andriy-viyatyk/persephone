appId: com.viyatyk.persephone
productName: persephone
copyright: Copyright © Andriy Viyatyk

directories:
  output: release

# Files to include in the asar archive
files:
  - package.json
  - .vite/**/*
  - "!.vite/module-service-host/**"
  - "!.vite/node-script-host/**"
  - "!.vite/test-host/**"
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,LICENCE}"
  # koffi ships prebuilt binaries for every OS plus its C++ sources; the app needs only the build for
  # the target platform (index.js picks the binary with a per-platform switch, so the others are never
  # required). ${platform}_${arch} expands to win32_x64 or linux_x64. This stays a top-level pattern:
  # a platform-level `files` list makes electron-builder add its default "**/*" and pack the whole repo.
  - "!node_modules/koffi/{src,vendor,doc}/**"
  - "!node_modules/koffi/build/koffi/!(${platform}_${arch})/**"
  - "!node_modules/**/*.{ts,map}"

# Assets go into resources/ (outside asar), matching Forge behavior
extraResources:
  - from: assets
    to: assets
  - from: .vite/module-service-host/module-service-host.mjs
    to: assets/module-service-host.mjs
  - from: .vite/node-script-host/node-script-host.mjs
    to: assets/node-script-host.mjs
  - from: .vite/test-host/test-host.mjs
    to: assets/test-host.mjs

# Windows-specific payloads sit beside the app executable (outside asar).
win:
  extraFiles:
    # Plain-text orientation file in the installation root. Its real audience is an AI agent
    # helping a first-time user: nothing auto-loads an installed app's folder into an agent's
    # context, but an agent pointed at this directory finds a README, and this one tells it
    # that the full guides are already on disk under resources/assets and how to switch the
    # MCP server on by editing appSettings.json. Windows-specific text, so Windows only.
    - from: build/README.txt
      to: README.txt
    - from: launcher/target/release/persephone-launcher.exe
      to: persephone-launcher.exe
    - from: launcher/target/release/persephone-test.exe
      to: persephone-test.exe
    - from: snip-tool/target/release/persephone-snip.exe
      to: persephone-snip.exe
    # Mneme sidecar. ONNX Runtime is statically linked; the leftover directml.dll
    # import is resolved from Windows System32 (CPU-only inference, no GPU), so no
    # DLLs are bundled alongside. Spawned via getMnemeExePath() in mneme-service.ts.
    - from: mneme/target/release/mneme.exe
      to: mneme.exe
  icon: assets/icon.ico
  target:
    - target: nsis
    - target: zip

asar: true
asarUnpack:
  - node_modules/koffi/build/koffi/${platform}_${arch}/koffi.node

# Electron fuses, flipped by electron-builder right before signing (EPIC-118 / US-1591).
# - runAsNode off: persephone.exe is not a Node runtime. Board Node scripts run in a
#   utilityProcess (assets/node-script-host.mjs) instead.
# - nodeOptions / nodeCliInspect off: NODE_OPTIONS, NODE_EXTRA_CA_CERTS and --inspect are
#   ignored by the release build.
# - asar integrity + onlyLoadAppFromAsar: app.asar is hash-checked at load and is the only
#   app source. electron-builder embeds the hash in the exe.
# - cookieEncryption on: browser cookies are encrypted at rest (DPAPI). One-way: existing
#   plaintext cookies stay readable and are encrypted on their next write.
# - grantFileProtocolExtraPrivileges stays at its default (on): the production window loads
#   index.html over file:// (open-window.ts loadFile).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Use Castlabs Electron for Widevine CDM (DRM) support.
# @electron/get builds the URL as `mirror + customDir`, and customDir defaults
# to `v${version}` — so the mirror must NOT end in `v`, otherwise the tag
# doubles up (…/download/vv44.9.3+wvcus/…) and 404s.
electronDownload:
  mirror: "https://github.com/castlabs/electron-releases/releases/download/"

# VMP-sign the Electron binary for Widevine DRM (Netflix, Disney+, etc.)
# Uses afterSign (not afterPack) because on Windows VMP signing must happen
# AFTER code-signing (Authenticode/signtool), otherwise signtool overwrites the VMP signature.
# Set VMP_SIGN=true environment variable to enable signing.
afterSign: scripts/vmp-sign.mjs

linux:
  extraFiles:
    - from: mneme/target/release/mneme
      to: mneme
    - from: snip-tool/target/release/persephone-snip
      to: persephone-snip
  # The .deb is the only Linux format. An AppImage was built and dropped (US-2235): on Ubuntu,
  # electron-builder's AppRun falls back to --no-sandbox, and it needs libfuse2, which Ubuntu 26.04
  # and Debian 13 do not install.
  target:
    - target: deb
      arch: [x64]
  executableName: persephone
  syncDesktopName: true
  icon: assets/icon.png
  category: Development;TextEditor
  synopsis: Developer notepad and data tools
  description: Tabbed developer notepad with code editing, data tools, scripting and a built-in browser.
  desktop:
    entry:
      Name: Persephone
      StartupWMClass: com.viyatyk.persephone
  mimeTypes:
    - text/plain
    - inode/directory

deb:
  artifactName: "persephone-${version}-linux-${arch}.${ext}"
  # electron-builder's defaults plus every library dpkg-shlibdeps reports for the packaged ELF files
  # (US-2234 audit). "t64 | old" covers the 64-bit time_t renames in Ubuntu 24.04+ and Debian 13.
  # Unversioned: the glibc floor comes from the build machine, so release packages are built on
  # Ubuntu 24.04 (glibc 2.39); a build on 26.04 makes mneme need glibc 2.43 and fail on Debian 13.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libnspr4
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libatk1.0-0t64 | libatk1.0-0
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libglib2.0-0t64 | libglib2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
    - libcups2t64 | libcups2
    - libdrm2
    - libcairo2
    - libpango-1.0-0
    - libdbus-1-3
    - libexpat1
    - libudev1
    - libgcc-s1
    - libstdc++6
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2

nsis:
  artifactName: "persephone-setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  # NSIS 3.0.4 lacks the five "Choose Users" page strings for Lithuanian, Latvian, Estonian and
  # Romanian and warns that it uses the English ones; a warning would otherwise fail the build.
  warningsAsErrors: false
  installerLanguages:
    - en_US
    - uk_UA
    - pl_PL
    - lt_LT
    - lv_LV
    - et_EE
    - be_BY
    - ro_RO
    - sk_SK
    - hu_HU
    - de_DE
    - fr_FR
    - es_ES
    - pt_BR
    - it_IT
    - zh_CN
    - ja_JP
    - ko_KR
  perMachine: false
  allowElevation: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  menuCategory: Persephone
  shortcutName: Persephone
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

publish:
  provider: github
  owner: andriy-viyatyk
  repo: persephone
  releaseType: draft
