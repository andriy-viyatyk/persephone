appId: com.viyatyk.persephone
productName: persephone
copyright: Copyright © Andriy Viyatyk

directories:
  output: release

# Files to include in the asar archive
files:
  - package.json
  - .vite/**/*
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,LICENCE}"
  - "!node_modules/**/*.{ts,map}"

# Assets go into resources/ (outside asar), matching Forge behavior
extraResources:
  - from: assets
    to: assets

# Rust binaries sit next to the main exe (outside asar)
extraFiles:
  # Plain-text orientation file in the installation root. Its real audience is an AI agent
  # helping a first-time user: nothing auto-loads an installed app's folder into an agent's
  # context, but an agent pointed at this directory finds a README, and this one tells it
  # that the full guides are already on disk under resources/assets and how to switch the
  # MCP server on by editing appSettings.json.
  - from: build/README.txt
    to: README.txt
  - from: launcher/target/release/persephone-launcher.exe
    to: persephone-launcher.exe
  - from: snip-tool/target/release/persephone-snip.exe
    to: persephone-snip.exe
  # Mneme sidecar. ONNX Runtime is statically linked; the leftover directml.dll
  # import is resolved from Windows System32 (CPU-only inference, no GPU), so no
  # DLLs are bundled alongside. Spawned via getMnemeExePath() in mneme-service.ts.
  - from: mneme/target/release/mneme.exe
    to: mneme.exe

asar: true

# Electron fuses, flipped by electron-builder right before signing (EPIC-118 / US-1591).
# - runAsNode off: persephone.exe is not a Node runtime. Board Node scripts run in a
#   utilityProcess (assets/node-script-host.mjs) instead.
# - nodeOptions / nodeCliInspect off: NODE_OPTIONS, NODE_EXTRA_CA_CERTS and --inspect are
#   ignored by the release build.
# - asar integrity + onlyLoadAppFromAsar: app.asar is hash-checked at load and is the only
#   app source. electron-builder embeds the hash in the exe.
# - cookieEncryption on: browser cookies are encrypted at rest (DPAPI). One-way: existing
#   plaintext cookies stay readable and are encrypted on their next write.
# - grantFileProtocolExtraPrivileges stays at its default (on): the production window loads
#   index.html over file:// (open-window.ts loadFile).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Use Castlabs Electron for Widevine CDM (DRM) support.
# @electron/get builds the URL as `mirror + customDir`, and customDir defaults
# to `v${version}` — so the mirror must NOT end in `v`, otherwise the tag
# doubles up (…/download/vv43.0.0+wvcus/…) and 404s.
electronDownload:
  mirror: "https://github.com/castlabs/electron-releases/releases/download/"

# VMP-sign the Electron binary for Widevine DRM (Netflix, Disney+, etc.)
# Uses afterSign (not afterPack) because on Windows VMP signing must happen
# AFTER code-signing (Authenticode/signtool), otherwise signtool overwrites the VMP signature.
# Set VMP_SIGN=true environment variable to enable signing.
afterSign: scripts/vmp-sign.mjs

win:
  icon: assets/icon.ico
  target:
    - target: nsis
    - target: zip

nsis:
  artifactName: "persephone-setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  menuCategory: Persephone
  shortcutName: Persephone
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

publish:
  provider: github
  owner: andriy-viyatyk
  repo: persephone
  releaseType: draft
