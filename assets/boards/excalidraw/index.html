<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excalidraw</title>
    <link rel="stylesheet" href="./lib/index.css" />
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        /* Excalidraw paints nothing until its React bundle has loaded and mounted
           (~0.5s on a cold open), and a document with no background of its own paints
           the UA default white over the host iframe — a white flash on a dark theme.
           `--p-bg` is injected by the board:// handler as a `:root` <style> BEFORE this
           stylesheet is parsed, so this is themed at first paint with no script involved.
           The fallback is `transparent`, which reveals the iframe element's own themed
           background rather than white. Both track the app theme, which is also what
           seeds `drawDarkMode` below, so the placeholder matches what mounts over it. */
        html {
            background: var(--p-bg, transparent);
        }
    </style>
    <!-- import-map:start -->
    <script type="importmap">
    {
        "imports": {
            "@braintree/sanitize-url": "./lib/deps/braintree-sanitize-url.js",
            "@excalidraw/laser-pointer": "./lib/deps/excalidraw-laser-pointer.js",
            "@excalidraw/mermaid-to-excalidraw": "./lib/deps/excalidraw-mermaid-to-excalidraw.js",
            "@radix-ui/react-popover": "./lib/deps/radix-ui-react-popover.js",
            "@radix-ui/react-tabs": "./lib/deps/radix-ui-react-tabs.js",
            "browser-fs-access": "./lib/deps/browser-fs-access.js",
            "canvas-roundrect-polyfill": "./lib/deps/canvas-roundrect-polyfill.js",
            "clsx": "./lib/deps/clsx.js",
            "es6-promise-pool": "./lib/deps/es6-promise-pool.js",
            "fractional-indexing": "./lib/deps/fractional-indexing.js",
            "fuzzy": "./lib/deps/fuzzy.js",
            "image-blob-reduce": "./lib/deps/image-blob-reduce.js",
            "jotai": "./lib/deps/jotai.js",
            "jotai-scope": "./lib/deps/jotai-scope.js",
            "lodash.debounce": "./lib/deps/lodash-debounce.js",
            "lodash.throttle": "./lib/deps/lodash-throttle.js",
            "nanoid": "./lib/deps/nanoid.js",
            "open-color": "./lib/deps/open-color.js",
            "pako": "./lib/deps/pako.js",
            "perfect-freehand": "./lib/deps/perfect-freehand.js",
            "pica": "./lib/deps/pica.js",
            "png-chunk-text": "./lib/deps/png-chunk-text.js",
            "png-chunks-encode": "./lib/deps/png-chunks-encode.js",
            "png-chunks-extract": "./lib/deps/png-chunks-extract.js",
            "points-on-curve": "./lib/deps/points-on-curve.js",
            "react": "./lib/deps/react.js",
            "react-dom": "./lib/deps/react-dom.js",
            "react-dom/client": "./lib/deps/react-dom-client.js",
            "react/jsx-runtime": "./lib/deps/react-jsx-runtime.js",
            "roughjs/bin/generator": "./lib/deps/roughjs-bin-generator.js",
            "roughjs/bin/math": "./lib/deps/roughjs-bin-math.js",
            "roughjs/bin/rough": "./lib/deps/roughjs-bin-rough.js",
            "tunnel-rat": "./lib/deps/tunnel-rat.js"
        }
    }
    </script>
    <!-- import-map:end -->
</head>
<body>
    <div id="root"></div>
    <script type="module">
        window.EXCALIDRAW_ASSET_PATH = "./lib/";

        const reactModule = await import("react");
        const React = reactModule.default ?? reactModule;
        const { createRoot } = await import("react-dom/client");
        const {
            Excalidraw,
            FONT_FAMILY,
            convertToExcalidrawElements,
            exportToBlob,
            exportToSvg,
            serializeAsJSON,
        } = await import("./lib/index.js");
        const { parseMermaidToExcalidraw } = await import(
            "./lib/deps/excalidraw-mermaid-to-excalidraw.js",
        );

        const EMPTY_SCENE = { elements: [], appState: {}, files: {} };
        const IMAGE_OFFSET_X = 250;
        const IMAGE_OFFSET_Y = 120;
        const MAX_DIMENSION = 1200;
        const AI_VISION_MEMBERS = [
            { name: "id", kind: "property", summary: "The concrete current editor id." },
            { name: "name", kind: "property", summary: "The editor's registry display name." },
            { name: "addImage", kind: "method", signature: "addImage(dataUrl: string, options?: { x?: number; y?: number; maxDimension?: number }): Promise<void>", summary: "Insert an image onto the live canvas. Requires the drawing editor to be mounted (editorIsMounted === true)." },
            { name: "exportAsSvg", kind: "method", signature: "exportAsSvg(): Promise<string>", summary: "Export the drawing as SVG markup string." },
            { name: "exportAsPng", kind: "method", signature: "exportAsPng(options?: { scale?: number }): Promise<string>", summary: "Export the drawing as PNG data URL." },
            { name: "elementCount", kind: "property", summary: "Number of elements on the canvas." },
            { name: "editorIsMounted", kind: "property", summary: "Whether the Excalidraw editor is currently mounted. When true, addImage() works. When false, addImage() throws." },
        ];

        function parseExcalidrawContent(content) {
            if (typeof content !== "string" || content.trim() === "") return EMPTY_SCENE;
            const data = JSON.parse(content);
            return {
                elements: data.elements || [],
                appState: data.appState || {},
                files: data.files || {},
            };
        }

        function sceneFingerprint(elements, files) {
            const elementPart = elements.map(
                (element) => `${element.id}:${element.version ?? 0}:${element.versionNonce ?? 0}`,
            ).join(";");
            const fileKeys = files ? Object.keys(files).sort().join(",") : "";
            return `${elementPart}|${fileKeys}`;
        }

        function capDimensions(width, height, maxDimension = MAX_DIMENSION) {
            const longer = Math.max(width, height);
            if (longer <= maxDimension) return { width, height };
            const scale = maxDimension / longer;
            return { width: Math.round(width * scale), height: Math.round(height * scale) };
        }

        function getImageDimensions(dataUrl) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
                image.onerror = () => reject(new Error("Failed to load image"));
                image.src = dataUrl;
            });
        }

        function mimeFromDataUrl(dataUrl) {
            return /^data:([^;,]+)/i.exec(dataUrl)?.[1] || "image/png";
        }

        function isPositiveDimension(value) {
            return typeof value === "number" && Number.isFinite(value) && value > 0;
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Failed to convert PNG to data URL"));
                reader.readAsDataURL(blob);
            });
        }

        const LIBRARY_FILENAME = "library.excalidrawlib";
        const LIBRARY_MIME_TYPE = "application/vnd.excalidrawlib+json";

        function errorMessage(error) {
            return error instanceof Error ? error.message : String(error);
        }

        function libraryFilePath(directory) {
            return `${directory.replace(/[\\/]+$/, "")}/${LIBRARY_FILENAME}`;
        }

        async function resolveLibraryPath() {
            const configuredDir = await persephone.settings.get("library-path");
            if (typeof configuredDir === "string" && configuredDir.trim() !== "") {
                return libraryFilePath(configuredDir);
            }
            const userData = await persephone.call("fs.commonFolder", { args: ["userData"] });
            if (typeof userData !== "string" || userData.trim() === "") {
                throw new Error("Persephone user data folder is unavailable.");
            }
            return libraryFilePath(`${userData}/data/excalidraw-lib`);
        }

        async function loadLibrary(_metadata) {
            try {
                const libraryFile = await resolveLibraryPath();
                const text = await persephone.readFile(libraryFile, { encoding: "utf8" });
                if (typeof text !== "string") return null;
                const data = JSON.parse(text);
                return { libraryItems: data.libraryItems || [] };
            } catch {
                return null;
            }
        }

        async function saveLibrary({ libraryItems }) {
            const libraryFile = await resolveLibraryPath();
            await persephone.writeFile(
                libraryFile,
                JSON.stringify({ libraryItems }, null, 2),
            );
        }

        let librarySaveQueue = Promise.resolve();
        let latestLibrarySave = Promise.resolve();
        let hasSeenNonEmptyLibrary = false;
        let libraryInstallInProgress = false;

        function queueLibrarySave(libraryItems) {
            if (libraryItems.length === 0
                && !hasSeenNonEmptyLibrary
                && !libraryInstallInProgress) {
                return Promise.resolve();
            }
            if (libraryItems.length > 0) hasSeenNonEmptyLibrary = true;
            const snapshot = JSON.parse(JSON.stringify(libraryItems));
            const save = librarySaveQueue.then(() => saveLibrary({ libraryItems: snapshot }));
            librarySaveQueue = save.catch(() => {});
            latestLibrarySave = save.catch((error) => {
                persephone.notify(`Failed to save Excalidraw library: ${errorMessage(error)}`, "error");
                throw error;
            });
            void latestLibrarySave.catch(() => {});
            return latestLibrarySave;
        }

        function waitForLatestLibrarySave() {
            return latestLibrarySave;
        }

        function handleLibraryChange(libraryItems) {
            return queueLibrarySave(libraryItems);
        }

        async function loadExistingLibrary(api) {
            try {
                const data = await loadLibrary({ source: "load" });
                await api.updateLibrary({
                    libraryItems: data?.libraryItems || [],
                    merge: true,
                });
                await waitForLatestLibrarySave();
            } catch (error) {
                persephone.notify(`Failed to load Excalidraw library: ${errorMessage(error)}`, "error");
            }
        }

        function countLibraryItems(data) {
            const items = Array.isArray(data?.libraryItems)
                ? data.libraryItems
                : Array.isArray(data?.library)
                    ? data.library
                    : undefined;
            return items?.length;
        }

        function decodedLibraryUrl(encodedUrl) {
            let decoded;
            try {
                decoded = decodeURIComponent(encodedUrl);
            } catch {
                throw new Error("The returned library URL is not valid.");
            }
            const url = new URL(decoded);
            if (url.protocol !== "http:" && url.protocol !== "https:") {
                throw new Error("The returned library URL must use HTTP or HTTPS.");
            }
            return url.toString();
        }

        async function downloadLibrary(libraryUrl) {
            return persephone.executeNode("library-fetch.cjs", [libraryUrl]).getJson();
        }

        async function installReturnedLibrary(event) {
            const api = excalidrawApi;
            if (!api) return;
            const encodedUrl = event.hash.addLibrary?.[0];
            if (!encodedUrl) return;

            await libraryLoadPromise;
            const libraryUrl = decodedLibraryUrl(encodedUrl);
            const libraryData = await downloadLibrary(libraryUrl);
            const count = countLibraryItems(libraryData);
            const message = count === undefined
                ? "Add the downloaded library to your drawing library?"
                : `This will add ${count} item${count === 1 ? "" : "s"} to your library.`;
            const answer = await persephone.call("ui.confirm", {
                args: [message, { title: "Add library", buttons: ["Add", "Cancel"] }],
            });
            if (answer !== "Add") return;

            libraryInstallInProgress = true;
            try {
                const libraryBlob = new Blob([JSON.stringify(libraryData)], { type: LIBRARY_MIME_TYPE });
                await api.updateLibrary({
                    libraryItems: libraryBlob,
                    merge: true,
                    prompt: false,
                    defaultStatus: "published",
                    openLibraryMenu: true,
                });
            } finally {
                libraryInstallInProgress = false;
            }
            await waitForLatestLibrarySave();
        }

        function handleLibraryReturn(event) {
            void installReturnedLibrary(event).catch((error) => {
                persephone.notify(`Failed to install Excalidraw library: ${errorMessage(error)}`, "error");
            });
        }

        // A board page can exist without a content host: the "New Excalidraw" creatable row
        // opens one standalone, and a capability intent will too. `persephone.host.getContent`
        // rejects in that case, and letting it reject here kills the module before anything
        // renders — which is a blank page, not a degraded one.
        let hostAttached = true;
        let initialContent = "";
        try {
            initialContent = await persephone.host.getContent();
        } catch {
            hostAttached = false;
        }
        const initialScene = parseExcalidrawContent(initialContent);
        let libraryReturnUrl;
        try {
            libraryReturnUrl = await persephone.navigation.createReturnUrl();
        } catch (error) {
            console.error("Failed to create Excalidraw library return URL:", error);
        }
        let scene = initialScene;
        let excalidrawApi = null;
        let libraryLoadPromise = Promise.resolve();
        let saveTimer;
        let lastFingerprint = sceneFingerprint(scene.elements, scene.files);
        let drawDarkMode = !!persephone.theme.isDark;
        // Do not let Excalidraw's initial empty onChange callbacks write a serialized empty
        // scene over a host that this instance has not populated. Once the user or an intent
        // creates an element/file, an intentional later delete-to-empty is allowed.
        let allowEmptySceneWrite = scene.elements.length > 0 || Object.keys(scene.files).length > 0;
        let resolveEditorReady;
        let editorReadySettled = false;
        const editorReady = new Promise((resolve) => { resolveEditorReady = resolve; });

        // Excalidraw applies `initialData` ASYNCHRONOUSLY, after it hands back the imperative
        // API. Treating the API callback as "ready" loses any programmatic insertion made in
        // between: the component commits `initialData` afterwards and wipes it. Measured on a
        // capability page - the image inserted at +33ms was gone by +111ms, and the board then
        // serialized the empty scene over the good content. The first `onChange` after adoption
        // is the earliest point at which the opening scene is committed, so gate on that. The
        // timer is a floor, not the mechanism: if a build ever stops firing that first change,
        // an intent waits a beat instead of hanging forever.
        function markEditorReady() {
            if (editorReadySettled) return;
            editorReadySettled = true;
            resolveEditorReady();
        }

        function getCurrentScene() {
            if (!excalidrawApi) return scene;
            return {
                elements: excalidrawApi.getSceneElements(),
                appState: excalidrawApi.getAppState(),
                files: excalidrawApi.getFiles(),
            };
        }

        function cancelScheduledSave() {
            if (saveTimer !== undefined) {
                clearTimeout(saveTimer);
                saveTimer = undefined;
            }
        }

        function applyExternalScene(nextScene) {
            cancelScheduledSave();
            scene = nextScene;
            lastFingerprint = sceneFingerprint(scene.elements, scene.files);
            if (!excalidrawApi) return;
            excalidrawApi.addFiles(Object.values(scene.files));
            excalidrawApi.updateScene({
                elements: scene.elements,
                appState: scene.appState,
            });
        }

        function scheduleHostWrite(elements, appState, files) {
            // Excalidraw has committed its opening scene by the time it reports the first
            // change, so this is where an intent may safely start drawing.
            if (excalidrawApi) markEditorReady();
            scene = { elements, appState, files };
            const fingerprint = sceneFingerprint(elements, files);
            if (fingerprint === lastFingerprint) return;
            const isEmpty = elements.length === 0 && Object.keys(files || {}).length === 0;
            if (isEmpty && !allowEmptySceneWrite) {
                lastFingerprint = fingerprint;
                cancelScheduledSave();
                return;
            }
            if (!isEmpty) allowEmptySceneWrite = true;
            lastFingerprint = fingerprint;
            cancelScheduledSave();
            saveTimer = setTimeout(() => {
                saveTimer = undefined;
                if (!hostAttached) return;
                persephone.host.setContent(
                    serializeAsJSON(scene.elements, scene.appState, scene.files, "local"),
                );
            }, 500);
        }

        function writeCurrentSceneToHost() {
            if (!hostAttached) throw new Error("The drawing board has no content host.");
            cancelScheduledSave();
            const currentScene = getCurrentScene();
            scene = currentScene;
            lastFingerprint = sceneFingerprint(scene.elements, scene.files);
            persephone.host.setContent(
                serializeAsJSON(scene.elements, scene.appState, scene.files, "local"),
            );
        }

        function insertImage(dataUrl, mimeType, dimensions, options) {
            const api = excalidrawApi;
            if (!api) throw new Error("The drawing editor is not mounted.");
            const fileId = crypto.randomUUID();
            const { width, height } = capDimensions(
                dimensions.width,
                dimensions.height,
                options?.maxDimension,
            );
            api.addFiles([{
                id: fileId,
                dataURL: dataUrl,
                mimeType,
                created: Date.now(),
            }]);
            const newElements = convertToExcalidrawElements([{
                type: "image",
                x: options?.x ?? IMAGE_OFFSET_X,
                y: options?.y ?? IMAGE_OFFSET_Y,
                width,
                height,
                fileId,
                status: "saved",
            }]);
            api.updateScene({
                elements: [...api.getSceneElements(), ...newElements],
            });
        }

        function hasExportableElements() {
            if (!excalidrawApi || excalidrawApi.getSceneElements().length === 0) {
                if (excalidrawApi) {
                    persephone.notify("Nothing to export — the drawing is empty", "warning");
                }
                return false;
            }
            return true;
        }

        async function exportCurrentSvgText() {
            const currentScene = getCurrentScene();
            const svg = await exportToSvg({
                elements: currentScene.elements,
                appState: {
                    ...currentScene.appState,
                    exportBackground: true,
                    exportWithDarkMode: drawDarkMode,
                },
                files: currentScene.files,
            });
            return svg.outerHTML;
        }

        async function exportCurrentPngBlob(scale = 2) {
            const currentScene = getCurrentScene();
            return exportToBlob({
                elements: currentScene.elements,
                appState: {
                    ...currentScene.appState,
                    exportBackground: true,
                    exportWithDarkMode: drawDarkMode,
                    exportScale: scale,
                },
                files: currentScene.files,
                mimeType: "image/png",
            });
        }

        const unsubscribe = hostAttached
            ? persephone.host.onContentChange((nextContent) => {
                applyExternalScene(parseExcalidrawContent(nextContent));
            })
            : () => {};

        const model = {
            aiVision: {
                kind: "DrawEditor",
                summary: "Drawing (Excalidraw) facade.",
                members: AI_VISION_MEMBERS,
                summarize: () => ({
                    kind: "DrawEditor",
                    id: "excalidraw",
                    name: "Excalidraw",
                    elementCount: model.elementCount,
                    editorIsMounted: model.editorIsMounted,
                }),
            },
            id: "excalidraw",
            name: "Excalidraw",
            get elementCount() {
                return excalidrawApi?.getSceneElements().length ?? scene.elements.length;
            },
            get editorIsMounted() {
                return excalidrawApi !== null;
            },
            async addImage(dataUrl, options) {
                const api = excalidrawApi;
                if (!api) {
                    throw new Error(
                        "addImage() requires the drawing editor to be mounted. " +
                        "Use app.pages.addDrawPage(dataUrl) to create a new page with an image instead.",
                    );
                }

                const dimensions = await getImageDimensions(dataUrl);
                insertImage(dataUrl, mimeFromDataUrl(dataUrl), dimensions, options);
            },
            async exportAsSvg() {
                return exportCurrentSvgText();
            },
            async exportAsPng(options) {
                const blob = await exportCurrentPngBlob(options?.scale ?? 2);
                return blobToDataUrl(blob);
            },
        };

        persephone.aiVision.expose(model);

        function drawToolbarControls() {
            return [
                {
                    id: "draw-theme",
                    type: "button",
                    title: drawDarkMode ? "Switch to Light Theme" : "Switch to Dark Theme",
                    icon: { name: drawDarkMode ? "sun" : "moon" },
                },
                {
                    id: "draw-copy-image",
                    type: "button",
                    title: "Copy Image to Clipboard",
                    icon: { name: "copy" },
                },
                {
                    id: "draw-save",
                    type: "menu",
                    title: "Save as file",
                    icon: { name: "download" },
                    items: [
                        { id: "save-svg", label: "Save as SVG" },
                        { id: "save-png", label: "Save as PNG" },
                    ],
                },
                {
                    id: "draw-open-new-tab",
                    type: "menu",
                    title: "Open in new tab",
                    icon: { name: "new-window" },
                    items: [
                        { id: "open-svg", label: "Open as SVG" },
                        { id: "open-image", label: "Open as Image" },
                    ],
                },
                {
                    id: "draw-snip",
                    type: "button",
                    title: "Screen Snip",
                    icon: { name: "snip" },
                },
            ];
        }

        async function getDefaultName(extension) {
            try {
                const filePath = await persephone.getFilePath();
                if (typeof filePath === "string" && filePath.trim() !== "") {
                    const fileName = filePath.replace(/^.*[\\/]/, "").replace(/\.excalidraw$/i, "");
                    if (fileName) return `${fileName}.${extension}`;
                }
            } catch (error) {
                persephone.notify(
                    `Failed to determine the drawing file path: ${errorMessage(error)}. Using a default name.`,
                    "warning",
                );
            }
            return `drawing.${extension}`;
        }

        function notifyToolbarFailure(label, error) {
            const code = error && typeof error === "object" && typeof error.code === "string"
                ? `${error.code}: `
                : "";
            persephone.notify(`${label}: ${code}${errorMessage(error)}`, "error");
        }

        async function handleCopyImage() {
            if (!excalidrawApi || !hasExportableElements()) return;
            try {
                const blob = await exportCurrentPngBlob();
                // Not `navigator.clipboard`: the click that got us here landed on
                // Persephone's toolbar, so this frame's document is not focused and the
                // write would reject with "Document is not focused".
                await persephone.clipboard.writeImage(await blob.arrayBuffer());
            } catch (error) {
                notifyToolbarFailure("Failed to copy image", error);
            }
        }

        async function handleSave(value) {
            if (!excalidrawApi || !hasExportableElements()) return;
            if (value === "save-svg") {
                try {
                    const svgText = await exportCurrentSvgText();
                    const savePath = await persephone.saveFileDialog({
                        title: "Save as SVG",
                        defaultPath: await getDefaultName("svg"),
                        filters: [{ name: "SVG", extensions: ["svg"] }],
                    });
                    if (savePath) await persephone.writeFile(savePath, svgText);
                } catch (error) {
                    notifyToolbarFailure("Export failed", error);
                }
                return;
            }
            if (value === "save-png") {
                try {
                    const blob = await exportCurrentPngBlob();
                    const savePath = await persephone.saveFileDialog({
                        title: "Save as PNG",
                        defaultPath: await getDefaultName("png"),
                        filters: [{ name: "PNG", extensions: ["png"] }],
                    });
                    if (savePath) {
                        const bytes = new Uint8Array(await blob.arrayBuffer());
                        await persephone.writeFile(savePath, bytes, { encoding: "binary" });
                    }
                } catch (error) {
                    notifyToolbarFailure("Export failed", error);
                }
            }
        }

        async function handleOpenNewTab(value) {
            if (!excalidrawApi || !hasExportableElements()) return;
            if (value === "open-svg") {
                try {
                    const svgText = await exportCurrentSvgText();
                    await persephone.capabilities.invoke("content.view", {
                        representation: "svg",
                        content: svgText,
                        language: "xml",
                        title: await getDefaultName("svg"),
                    });
                } catch (error) {
                    notifyToolbarFailure("Export failed", error);
                }
                return;
            }
            if (value === "open-image") {
                try {
                    const blob = await exportCurrentPngBlob();
                    const dataUrl = await blobToDataUrl(blob);
                    persephone.openRawLink(dataUrl, { editor: "image-view" });
                } catch (error) {
                    notifyToolbarFailure("Export failed", error);
                }
            }
        }

        async function handleScreenSnip() {
            if (!excalidrawApi) return;
            try {
                const dataUrl = await persephone.call("shell.startScreenSnip", { args: [true] });
                if (typeof dataUrl !== "string" || !dataUrl) return;
                const dimensions = await getImageDimensions(dataUrl);
                insertImage(dataUrl, mimeFromDataUrl(dataUrl), dimensions);
                writeCurrentSceneToHost();
            } catch (error) {
                notifyToolbarFailure("Screen snip failed", error);
            }
        }

        function handleDrawToolbarAction(event) {
            if (!event || typeof event !== "object") return;
            if (event.id === "draw-theme" && event.type === "button") {
                drawDarkMode = !drawDarkMode;
                renderBoard();
                persephone.toolbar.update([{
                    id: "draw-theme",
                    title: drawDarkMode ? "Switch to Light Theme" : "Switch to Dark Theme",
                    icon: { name: drawDarkMode ? "sun" : "moon" },
                }]);
                return;
            }
            if (event.id === "draw-copy-image" && event.type === "button") {
                void handleCopyImage();
                return;
            }
            if (event.id === "draw-save" && event.type === "menu" && typeof event.value === "string") {
                void handleSave(event.value);
                return;
            }
            if (event.id === "draw-open-new-tab" && event.type === "menu" && typeof event.value === "string") {
                void handleOpenNewTab(event.value);
                return;
            }
            if (event.id === "draw-snip" && event.type === "button") {
                void handleScreenSnip();
            }
        }

        persephone.toolbar.set(drawToolbarControls());
        const unsubscribeToolbar = persephone.toolbar.onAction(handleDrawToolbarAction);

        // Excalidraw carries its own light/dark palette and defaults to light, so without
        // this it stays bright inside a dark Persephone. `initialData` is read once at
        // mount, so re-rendering only updates `theme`; the scene is untouched.
        const root = createRoot(document.getElementById("root"));

        // Stable across renders, and seeds the scene only once: a theme re-render must not
        // push the opening scene back over whatever the user has drawn since.
        function adoptExcalidrawApi(api) {
            if (excalidrawApi) return;
            excalidrawApi = api;
            api.addFiles(Object.values(scene.files));
            api.updateScene({ elements: scene.elements, appState: scene.appState });
            libraryLoadPromise = loadExistingLibrary(api);
            setTimeout(markEditorReady, 1000);
        }

        function objectPayload(intent, capability) {
            const payload = intent.payload;
            if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
                throw new TypeError(`${capability} expects an object payload.`);
            }
            return payload;
        }

        function requiredText(payload, key, capability) {
            if (typeof payload[key] !== "string" || !payload[key].trim()) {
                throw new TypeError(`${capability} expects a non-empty string ${key}.`);
            }
            return payload[key];
        }

        async function handleImageIntent(intent) {
            const payload = objectPayload(intent, "image.edit");
            const dataUrl = requiredText(payload, "dataUrl", "image.edit");
            requiredText(payload, "title", "image.edit");
            const suppliedMime = payload.mimeType;
            if (suppliedMime !== undefined
                && (typeof suppliedMime !== "string" || !suppliedMime.trim())) {
                throw new TypeError("image.edit expects mimeType to be a non-empty string.");
            }
            const hasWidth = payload.naturalWidth !== undefined;
            const hasHeight = payload.naturalHeight !== undefined;
            if (hasWidth !== hasHeight
                || (hasWidth && (!isPositiveDimension(payload.naturalWidth)
                    || !isPositiveDimension(payload.naturalHeight)))) {
                throw new TypeError("image.edit expects positive naturalWidth and naturalHeight together.");
            }
            await editorReady;
            const dimensions = hasWidth
                ? { width: payload.naturalWidth, height: payload.naturalHeight }
                : await getImageDimensions(dataUrl);
            insertImage(dataUrl, suppliedMime?.trim() || mimeFromDataUrl(dataUrl), dimensions);
            writeCurrentSceneToHost();
            intent.resolve({});
        }

        async function handleDiagramIntent(intent) {
            const payload = objectPayload(intent, "diagram.edit");
            const source = requiredText(payload, "source", "diagram.edit");
            requiredText(payload, "title", "diagram.edit");
            let conversion;
            try {
                const converted = await parseMermaidToExcalidraw(source, {
                    themeVariables: { fontSize: "16px" },
                });
                const skeleton = converted.elements || [];
                for (const element of skeleton) {
                    if (element.type === "text") element.fontFamily = FONT_FAMILY.Helvetica;
                    if (element.label) element.label.fontFamily = FONT_FAMILY.Helvetica;
                }
                const elements = convertToExcalidrawElements(skeleton);
                conversion = {
                    elements,
                    files: converted.files || {},
                    imageOnly: elements.length > 0 && elements.every((element) => element.type === "image"),
                };
            } catch (error) {
                const message = typeof error === "string"
                    ? error
                    : error && typeof error === "object" && typeof error.message === "string"
                        ? error.message
                        : "Failed to convert Mermaid diagram.";
                intent.resolve({ status: "conversion-failed", message });
                return;
            }
            await editorReady;
            excalidrawApi.addFiles(Object.values(conversion.files));
            excalidrawApi.updateScene({
                elements: [...excalidrawApi.getSceneElements(), ...conversion.elements],
                appState: {
                    ...excalidrawApi.getAppState(),
                    currentItemFontFamily: FONT_FAMILY.Helvetica,
                },
            });
            writeCurrentSceneToHost();
            intent.resolve({ status: "opened", imageOnly: conversion.imageOnly });
        }

        async function handleCapabilityIntent(intent) {
            if (intent.version !== undefined && intent.version !== 1) {
                throw new Error(`Unsupported capability intent version: ${intent.version}.`);
            }
            if (intent.id === "image.edit") return handleImageIntent(intent);
            if (intent.id === "diagram.edit") return handleDiagramIntent(intent);
            throw new Error(`Unsupported capability intent: ${intent.id}.`);
        }

        function renderBoard() {
            root.render(
                React.createElement(Excalidraw, {
                    initialData: scene,
                    theme: drawDarkMode ? "dark" : "light",
                    onChange: scheduleHostWrite,
                    excalidrawAPI: adoptExcalidrawApi,
                    ...(libraryReturnUrl ? { libraryReturnUrl } : {}),
                    onLibraryChange: handleLibraryChange,
                    UIOptions: {
                        canvasActions: {
                            loadScene: false,
                            saveToActiveFile: false,
                            export: false,
                            toggleTheme: false,
                        },
                    },
                }),
            );
        }

        // `onThemeChange` invokes its callback immediately, which performs the first render.
        const unsubscribeReturn = persephone.navigation.onReturn(handleLibraryReturn);
        const unsubscribeTheme = persephone.onThemeChange(renderBoard);
        const unsubscribeIntent = persephone.intent.onRequest((intent) => {
            void handleCapabilityIntent(intent).catch((error) => intent.reject(error));
        });

        window.addEventListener("beforeunload", () => {
            cancelScheduledSave();
            unsubscribe();
            unsubscribeReturn();
            unsubscribeTheme();
            unsubscribeIntent();
            unsubscribeToolbar();
        }, { once: true });
    </script>
</body>
</html>
